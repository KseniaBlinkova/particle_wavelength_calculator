<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Лента — {{.Particle.Name}}</title>
    <link rel="stylesheet" href="/static/css/particles.css">
</head>
<body>
    <div class="phone-frame">
        <div class="feed-page">

            <video class="feed-video" autoplay loop muted playsinline webkit-playsinline>
                <source src="{{.VideoURL}}" type="video/mp4">
            </video>
            <div class="feed-overlay"></div>

            <div class="feed-content">

                <div class="feed-header">РАСЧЕТ ДЛИНЫ ВОЛНЫ ДЕ БРОЙЛЯ ДЛЯ ЧАСТИЦ</div>

                <div class="feed-bottom">

                    <div class="particle-name">{{.Particle.Name}}</div>

                    <div class="particle-card">
                        <div class="param-row">
                            <span class="param-label">Масса:</span>
                            <span class="param-value">{{.Particle.Mass}} кг</span>
                        </div>
                        <div class="param-row">
                            <span class="param-label">Спин:</span>
                            <span class="param-value">{{.Particle.Spin}}</span>
                        </div>
                        <div class="param-row">
                            <span class="param-label">Длина волны λ:</span>
                            <span class="param-value">{{.Particle.Wavelength}} м</span>
                        </div>
                    </div>

                    <div class="bottom-row">

                        <div class="particle-description">
                            <details class="read-more-details">
                                <summary class="read-more">
                                    <span class="collapsed-description">
                                        <span class="particle-description-text">{{.Particle.FullDescription}}</span>
                                        <span class="read-more-label">Ещё ›</span>
                                    </span>
                                    <span class="collapse-label">Свернуть ‹</span>
                                </summary>
                                <p class="particle-full-description">{{.Particle.FullDescription}}</p>
                            </details>
                        </div>

                        <div class="action-buttons">

                            <button class="btn-like" type="button">
                                <svg class="heart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                                </svg>
                                <span class="count">{{.LikesCount}}</span>
                            </button>

                            {{if .HasNext}}
                            <a href="/feed?id={{.Particle.ID}}&next=true" class="btn-next">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                    <path d="M5 12h14"></path>
                                    <path d="M12 5l7 7-7 7"></path>
                                    <line x1="19" y1="5" x2="19" y2="19"></line>
                                </svg>
                            </a>
                            {{end}}

                        </div>
                    </div>

                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="/feed" class="nav-item active">
                <span class="nav-icon">⌂</span>
                <span>Лента</span>
            </a>
            <a href="/draft" class="nav-item">
                <span class="nav-icon">＋</span>
                <span>Добавить</span>
            </a>
            <a href="/cards" class="nav-item">
                <span class="nav-icon">▦</span>
                <span>Плитка</span>
            </a>
        </nav>
    </div>
</body>
</html>
