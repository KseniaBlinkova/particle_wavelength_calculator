services:
  postgres_particle:
    image: postgres:17
    container_name: particle_postgres
    environment:
      POSTGRES_USER: particle_user
      POSTGRES_PASSWORD: particle_pass
      POSTGRES_DB: particle_db
    ports:
      - "5433:5432"
    volumes:
      - particle_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U particle_user -d particle_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio_particle:
    image: minio/minio:latest
    container_name: particle_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - particle_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer_particle:
    image: adminer
    container_name: particle_adminer
    ports:
      - "8090:8080"
    depends_on:
      postgres_particle:
        condition: service_healthy

volumes:
  particle_postgres_data:
  particle_minio_data:
