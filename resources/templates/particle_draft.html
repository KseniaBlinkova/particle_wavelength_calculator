<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Добавление</title>
    <link rel="stylesheet" href="/static/css/particles.css">
</head>
<body>
    <div class="phone-frame">
        <div class="draft-page">

            <div class="draft-header">РАСЧЕТ ДЛИНЫ ВОЛНЫ ДЕ БРОЙЛЯ ДЛЯ ЧАСТИЦ</div>
            <h1 class="draft-title">Добавить</h1>

            {{if .HasDraft}}
            <form method="POST" action="/publish" class="draft-form">
                <input type="hidden" name="id" value="{{.Particle.ID}}">

                <div class="media-fields media-fields-readonly" aria-label="Добавленные медиафайлы">
                    <div class="media-box">
                        <img src="{{.ImageURL}}" alt="Фото">
                        <span class="media-label">Фото</span>
                    </div>
                    <div class="media-box">
                        <video src="{{.VideoURL}}" muted autoplay loop playsinline></video>
                        <span class="media-label">Видео</span>
                    </div>
                </div>

                <div class="text-fields">
                    <div class="field">
                        <label for="name">Название</label>
                        <input id="name" name="name" type="text" value="{{.Particle.Name}}" readonly>
                    </div>

                    <div class="field">
                        <label for="mass">Масса частицы (кг)</label>
                        <input id="mass" name="mass" type="number" min="0" step="any" value="{{.Particle.Mass}}">
                    </div>

                    <div class="field">
                        <label for="spin">Спин</label>
                        <input id="spin" name="spin" type="text" value="{{.Particle.Spin}}">
                    </div>

                    <div class="field">
                        <label for="full_description">Полное описание</label>
                        <textarea id="full_description" name="full_description" placeholder="Введите полное описание...">{{.Particle.FullDescription}}</textarea>
                    </div>

                </div>

                <button type="submit" class="publish-btn">Опубликовать</button>
            </form>

            {{else}}
            <form method="POST" action="/draft" class="draft-form">
                <div class="media-fields">
                    <div class="media-box">
                        <img src="{{.ImageURL}}" alt="Фото">
                        <span class="media-label">Фото</span>
                    </div>
                    <div class="media-box">
                        <video src="{{.VideoURL}}" muted autoplay loop playsinline></video>
                        <span class="media-label">Видео</span>
                    </div>
                </div>

                <div class="text-fields">
                    <div class="field">
                        <label for="name">Название</label>
                        <input id="name" name="name" type="text" placeholder="Введите название" required>
                    </div>
                </div>

                <button type="submit" class="next-btn">Далее</button>
            </form>
            {{end}}

        </div>

        <nav class="bottom-nav">
            <a href="/feed" class="nav-item">
                <span class="nav-icon">⌂</span>
                <span>Лента</span>
            </a>
            <a href="/draft" class="nav-item active">
                <span class="nav-icon">＋</span>
                <span>Добавить</span>
            </a>
            <a href="/cards" class="nav-item">
                <span class="nav-icon">▦</span>
                <span>Плитка</span>
            </a>
        </nav>
    </div>
</body>
</html>
